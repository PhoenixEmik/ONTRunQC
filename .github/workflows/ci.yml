name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Stable Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Check the minimal JSON/HTML/SVG build
        run: cargo test --locked --no-default-features

      - name: Install export validation and static Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ghostscript poppler-utils musl-tools

      - name: Decode native PDF and PostScript exports
        run: cargo test --locked figure_render::tests::external_pdf_postscript_decoders -- --ignored --exact

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build and smoke-test static Linux exports
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl
          for format in png pdf ps jpeg tiff bmp; do
            target/x86_64-unknown-linux-musl/release/poregauge analyze tests/fixtures/deep_qc.tsv \
              --smallfigures --format "$format" --output "$RUNNER_TEMP/musl-$format"
            test -s "$RUNNER_TEMP/musl-$format/figures/length-counts.$format"
          done
          printf 'channel\tstart_time\tsequence_length_template\tmean_qscore_template\n1\t0\t10\t8\n' > "$RUNNER_TEMP/source-a.tsv"
          cp "$RUNNER_TEMP/source-a.tsv" "$RUNNER_TEMP/source-b.tsv"
          target/x86_64-unknown-linux-musl/release/poregauge analyze \
            "$RUNNER_TEMP/source-a.tsv" "$RUNNER_TEMP/source-b.tsv" \
            --processors 2 --format svg --output "$RUNNER_TEMP/musl-parallel"
          test -s "$RUNNER_TEMP/musl-parallel/combined/figures/length-counts.svg"

  msrv:
    name: Rust 1.85 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Run tests with minimum supported Rust
        run: cargo test --locked
