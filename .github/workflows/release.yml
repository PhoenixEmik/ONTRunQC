name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example, v0.3.0)
        required: true
        type: string
      publish:
        description: Publish a GitHub Release after building
        default: false
        type: boolean
      replace_assets:
        description: Replace assets of an existing published release
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release tag and code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      binary: ${{ steps.version.outputs.binary }}
      product: ${{ steps.version.outputs.product }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Verify tag matches package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          tag = os.environ['RELEASE_TAG']
          with open('Cargo.toml', 'rb') as manifest:
              package = tomllib.load(manifest)['package']
              version = package['version']
              binary = package['name']
          products = {'poregauge': 'PoreGauge', 'ontrunqc': 'ONTRunQC'}
          if binary not in products:
              raise SystemExit(f'Unsupported release package: {binary}')
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Release tags must use vMAJOR.MINOR.PATCH (stable releases only).')
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match Cargo.toml version {version}.')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\ncommit={commit}\nbinary={binary}\nproduct={products[binary]}\n')
          PY

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            asset: linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
            asset: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BINARY_NAME: ${{ needs.validate.outputs.binary }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=yes
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=yes
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Install Linux binary inspection tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Use the Rust toolchain's bundled Linux linker and runtime
        if: runner.os == 'Linux'
        run: |
          host="$(rustc --version --verbose | sed -n 's/^host: //p')"
          linker_dir="$(rustc --print sysroot)/lib/rustlib/$host/bin"
          test -x "$linker_dir/rust-lld"
          echo "$linker_dir" >> "$GITHUB_PATH"

      - name: Run native tests
        run: cargo test --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Verify Linux binary has no dynamic runtime dependencies
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          binary = f"target/{os.environ['TARGET']}/release/{os.environ['BINARY_NAME']}"
          checks = [('--program-headers', 'INTERP'),
                    ('--dynamic', '(NEEDED)'),
                    ('--version-info', 'GLIBC_')]
          for option, forbidden in checks:
              output = subprocess.check_output(['readelf', option, binary], text=True)
              if forbidden in output:
                  raise SystemExit(f'{binary} is not self-contained: {forbidden} found by readelf {option}.')
          print('Verified static Linux executable: no loader, shared libraries, or GLIBC symbol requirements.')
          PY

      - name: Smoke-test and package binary
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
          PACKAGE_PLATFORM: ${{ matrix.asset }}
        run: |
          binary="target/$TARGET/release/$BINARY_NAME"
          test "$("$binary" --version)" = "$BINARY_NAME ${RELEASE_TAG#v}"
          "$binary" analyze tests/fixtures/deep_qc.tsv \
            --flowcell-layout promethion-3000 --format png --output "$RUNNER_TEMP/release-smoke"
          test -s "$RUNNER_TEMP/release-smoke/report.json"
          test -s "$RUNNER_TEMP/release-smoke/report.html"
          test -s "$RUNNER_TEMP/release-smoke/figures/length-counts.png"
          package="$BINARY_NAME-$RELEASE_TAG-$PACKAGE_PLATFORM"
          mkdir -p "dist/$package/docs"
          cp "$binary" README.md LICENSE "dist/$package/"
          cp docs/metrics.md "dist/$package/docs/"
          cp assets/fonts/LICENSE "dist/$package/docs/FONT-LICENSE"
          COPYFILE_DISABLE=1 tar -czf "dist/$package.tar.gz" -C dist "$package"

      - name: Test packaged binary on Rocky Linux 8
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PACKAGE_PLATFORM: ${{ matrix.asset }}
        run: |
          package="$BINARY_NAME-$RELEASE_TAG-$PACKAGE_PLATFORM"
          mkdir -p "$RUNNER_TEMP/rocky8-package"
          tar -xzf "dist/$package.tar.gz" -C "$RUNNER_TEMP/rocky8-package"
          docker run --rm --network none \
            --mount "type=bind,src=$RUNNER_TEMP/rocky8-package/$package,dst=/package,readonly" \
            --mount "type=bind,src=$PWD/tests/fixtures,dst=/fixtures,readonly" \
            --env RELEASE_TAG --env BINARY_NAME rockylinux:8 bash -euo pipefail -c '
              source /etc/os-release
              test "$ID" = rocky
              case "$VERSION_ID" in 8|8.*) ;; *) exit 1 ;; esac
              cat /etc/os-release
              test "$(/package/$BINARY_NAME --version)" = "$BINARY_NAME ${RELEASE_TAG#v}"
              /package/$BINARY_NAME analyze /fixtures/deep_qc.tsv \
                --flowcell-layout promethion-3000 --format png --output /tmp/qc_results
              test -s /tmp/qc_results/report.json
              test -s /tmp/qc_results/report.html
              test -s /tmp/qc_results/figures/length-counts.png
            '

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  assemble:
    name: Assemble tagged build artifacts
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 4
          sha256sum *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload archives and checksums
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.validate.outputs.binary }}-${{ needs.validate.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, assemble]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      PRODUCT_NAME: ${{ needs.validate.outputs.product }}
      REPLACE_ASSETS: ${{ inputs.replace_assets && 'true' || 'false' }}
    steps:
      - name: Download archives and checksums
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.validate.outputs.binary }}-${{ needs.validate.outputs.tag }}
          path: dist

      - name: Verify checksums before publishing
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Prepare draft, upload assets, and publish
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-state"; then
            if [ "$(cat "$RUNNER_TEMP/release-state")" != true ]; then
              if [ "$REPLACE_ASSETS" != true ]; then
                echo "Release $RELEASE_TAG is already published; enable replace_assets to rebuild it explicitly." >&2
                exit 1
              fi
              gh release edit "$RELEASE_TAG" --draft=true
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$PRODUCT_NAME $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          if [ "$REPLACE_ASSETS" = true ]; then
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets"
            while IFS= read -r asset; do
              case "$asset" in
                "poregauge-$RELEASE_TAG-x86_64-unknown-linux-gnu.tar.gz"|"poregauge-$RELEASE_TAG-aarch64-unknown-linux-gnu.tar.gz"|"poregauge-$RELEASE_TAG-x86_64-unknown-linux-musl.tar.gz"|"poregauge-$RELEASE_TAG-aarch64-unknown-linux-musl.tar.gz")
                  gh release delete-asset "$RELEASE_TAG" "$asset" --yes ;;
              esac
            done < "$RUNNER_TEMP/release-assets"
            gh release view "$RELEASE_TAG" --json body --jq '.body // ""' > "$RUNNER_TEMP/release-notes.md"
            if ! grep -q '^### Linux compatibility rebuild$' "$RUNNER_TEMP/release-notes.md"; then
              cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ### Linux compatibility rebuild

          Linux archives use statically linked musl with no system glibc dependency.
          Both Linux architectures passed static-link checks and synthetic JSON/HTML
          analysis in Rocky Linux 8 containers. For Intel/AMD Linux and HPC systems,
          use the `linux-x86_64` archive. ARM64 systems use `linux-arm64`.
          These replace the original GNU Linux archives.
          The application source tag is unchanged. Verify downloads with `SHA256SUMS`.
          NOTES
            fi
            sed \
              -e 's/x86_64-unknown-linux-musl/linux-x86_64/g' \
              -e 's/aarch64-unknown-linux-musl/linux-arm64/g' \
              "$RUNNER_TEMP/release-notes.md" > "$RUNNER_TEMP/release-notes-renamed.md"
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes-renamed.md"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
