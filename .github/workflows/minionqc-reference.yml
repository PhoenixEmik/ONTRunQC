name: MinIONQC reference

on:
  workflow_dispatch:
  push:
    branches: ['scientific-parity/**']

permissions:
  contents: read

concurrency:
  group: minionqc-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check out pinned public reference
        uses: actions/checkout@v7
        with:
          repository: roblanf/minion_qc
          ref: 54485d586038d8ee36f168dd94f31c423f52f581
          path: reference-source
          persist-credentials: false
      - name: Build PoreGauge
        run: cargo build --release --locked
      - name: Build pinned R environment
        run: docker build -t poregauge-minionqc-r -f tests/reference/Dockerfile tests/reference
      - name: Run actual reference and differential checks
        run: python3 -u tests/minionqc_reference.py reference-source --execute-r --docker poregauge-minionqc-r --output benchmark-results/minionqc-r
      - name: Retain numerical evidence and reference reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minionqc-reference-${{ github.sha }}
          path: |
            benchmark-results/minionqc-r/**/capture.json
            benchmark-results/minionqc-r/**/comparison.json
            benchmark-results/minionqc-r/**/*.log
            benchmark-results/minionqc-r/**/plot-inventory.json
            benchmark-results/minionqc-r/**/summary.yaml
            benchmark-results/minionqc-r/**/source-population.json
            benchmark-results/minionqc-r/**/*.pdf
            benchmark-results/minionqc-r/**/*.png
          retention-days: 14
          if-no-files-found: warn
