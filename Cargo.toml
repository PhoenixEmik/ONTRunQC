[package]
name = "ontrunqc"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "Streaming quality control for Oxford Nanopore sequencing summaries"
license = "MIT"
repository = "https://github.com/PhoenixEmik/ONTRunQC"

[features]
default = ["static-figures"]
static-figures = ["dep:resvg", "dep:svg2pdf", "dep:image", "dep:tiff", "dep:roxmltree"]

[dependencies]
anyhow = "1"
sha2 = "0.10.9"
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
base64 = "0.22"
resvg = { version = "0.45.1", default-features = false, features = ["text", "raster-images"], optional = true }
svg2pdf = { version = "0.13", default-features = false, features = ["image", "text"], optional = true }
# 0.25.9 retains the project's Rust 1.85 MSRV; newer releases require 1.88.
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "tiff", "bmp", "png"], optional = true }
flate2 = "1"
tiff = { version = "0.10.3", default-features = false, features = ["deflate"], optional = true }
roxmltree = { version = "0.20", optional = true }
