[package]
name = "poregauge"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Streaming quality control for Oxford Nanopore sequencing summaries"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
